# Deploy EconoMonitor to Azure App Service
#
# Validates pull requests, deploys pushes to 'main', and supports manual deploys.
#
# ── One-time setup ──────────────────────────────────────────────────────────
#
# OIDC is already configured (federated credentials created on the service
# principal). No JSON credentials blob is needed.
#
# In your GitHub repo go to Settings → Secrets and variables → Actions
# and add these repository secrets:
#
#    Secret name               Value
#    ─────────────────────     ────────────────────────────────────────────────
#    AZURE_CLIENT_ID           Your Entra application client ID
#    AZURE_TENANT_ID           Your Entra tenant ID
#    AZURE_SUBSCRIPTION_ID     Your Azure subscription ID
#    FRED_API_KEY              Your FRED API key
#    FRASER_API_KEY            Your FRASER API key
#
# These three are optional. Without them the app still runs: /rates needs no
# key at all, while /energy and /regional render a signup prompt instead of
# data, and readiness reports them as unconfigured without going degraded.
#
#    EIA_API_KEY               https://www.eia.gov/opendata/register.php
#    BEA_API_KEY               https://apps.bea.gov/API/signup/
#    CENSUS_API_KEY            https://api.census.gov/data/key_signup.html
#
# And these repository *variables* (Settings → Secrets and variables →
# Actions → Variables). They are not secrets — the app authenticates to Azure
# OpenAI with its managed identity, so there is no API key to store:
#
#    Variable name             Value
#    ─────────────────────     ────────────────────────────────────────────────
#    AZURE_OPENAI_ENDPOINT     https://<resource>.cognitiveservices.azure.com
#    AZURE_OPENAI_DEPLOYMENT   Your model deployment name (e.g. gpt-4o)
#
# ── App info (edit if you rename the Azure resources) ───────────────────────

name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME:      economonitor
  AZURE_RESOURCE_GROUP:   rg-economonitor
  NODE_VERSION:           "22.x"

permissions: {}

concurrency:
  group: azure-app-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check tracked files for secret patterns
        run: node scripts/check-secrets.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install accessibility test browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Next.js application (standalone mode)
        env:
          NODE_ENV: production
        run: npm run build

      # next.config.ts has output: "standalone", which produces a self-contained
      # server in .next/standalone (~37 MB) instead of shipping all of node_modules.
      # Static assets and public/ must be copied in before zipping.
      - name: Assemble standalone bundle
        if: github.event_name != 'pull_request'
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public        .next/standalone/public

      - name: Create deployment package
        if: github.event_name != 'pull_request'
        run: |
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../..
          echo "deploy.zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Upload deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-package
          path: deploy.zip
          retention-days: 3

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-package

      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name:  ${{ env.AZURE_WEBAPP_NAME }}
          package:   deploy.zip

      # Keep runtime settings in sync with what's in GitHub Secrets.
      #
      # Secrets are passed through `env:` rather than interpolated directly into
      # the script, so a value containing shell metacharacters cannot break out
      # of the command. Empty values are skipped instead of being written: an
      # unset secret previously overwrote a working App Setting with "",
      # which is how GITHUB_TOKEN silently disabled the AI features.
      #
      # AI auth uses the app's managed identity, so no key is synced here.
      - name: Sync App Settings
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        env:
          FRED_API_KEY:            ${{ secrets.FRED_API_KEY }}
          FRASER_API_KEY:          ${{ secrets.FRASER_API_KEY }}
          EIA_API_KEY:             ${{ secrets.EIA_API_KEY }}
          BEA_API_KEY:             ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY:          ${{ secrets.CENSUS_API_KEY }}
          AZURE_OPENAI_ENDPOINT:   ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          WEBAPP_NAME:             ${{ env.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP:          ${{ env.AZURE_RESOURCE_GROUP }}
        with:
          inlineScript: |
            set -euo pipefail
            SETTINGS=(NODE_ENV=production)
            for NAME in FRED_API_KEY FRASER_API_KEY EIA_API_KEY BEA_API_KEY CENSUS_API_KEY AZURE_OPENAI_ENDPOINT AZURE_OPENAI_DEPLOYMENT; do
              VALUE="${!NAME:-}"
              if [ -n "$VALUE" ]; then
                SETTINGS+=("$NAME=$VALUE")
              else
                echo "::warning::$NAME is empty; leaving the existing App Setting untouched."
              fi
            done
            az webapp config appsettings set \
              --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --settings "${SETTINGS[@]}" \
              --output none

  # ── Validate ──────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request'
    permissions: {}

    steps:
      - name: Check homepage returns HTTP 200
        run: |
          STATUS=000
          for ATTEMPT in {1..10}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --connect-timeout 10 --max-time 30 \
              "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net") || true
            echo "Homepage attempt $ATTEMPT status: $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 15
          done
          [ "$STATUS" = "200" ] || exit 1

      - name: Check AI chat request validation
        run: |
          STATUS=000
          for ATTEMPT in {1..5}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"messages":[]}' \
              "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/ai/chat") || true
            echo "Chat API attempt $ATTEMPT status: $STATUS"
            [ "$STATUS" = "400" ] && break
            sleep 10
          done
          [ "$STATUS" = "400" ] || exit 1

      - name: Deployment summary
        run: |
          echo "✅ EconoMonitor deployed successfully"
          echo "🌐 URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
