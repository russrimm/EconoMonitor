# Deploy EconoMonitor to Azure App Service
#
# Validates pull requests, deploys pushes to 'main', and supports manual deploys.
#
# ── One-time setup ──────────────────────────────────────────────────────────
#
# OIDC is already configured (federated credentials created on the service
# principal). No JSON credentials blob is needed.
#
# In your GitHub repo go to Settings → Secrets and variables → Actions
# and add these repository secrets:
#
#    Secret name               Value
#    ─────────────────────     ────────────────────────────────────────────────
#    AZURE_CLIENT_ID           Your Entra application client ID
#    AZURE_TENANT_ID           Your Entra tenant ID
#    AZURE_SUBSCRIPTION_ID     Your Azure subscription ID
#    FRED_API_KEY              Your FRED API key
#    FRASER_API_KEY            Your FRASER API key
#    GITHUB_TOKEN_AI           Your GitHub PAT (for Models API / AI features)
#
# ── App info (edit if you rename the Azure resources) ───────────────────────

name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME:      economonitor
  AZURE_RESOURCE_GROUP:   rg-economonitor
  NODE_VERSION:           "22.x"

permissions: {}

jobs:
  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check tracked files for secret patterns
        run: node scripts/check-secrets.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Next.js application (standalone mode)
        env:
          NODE_ENV: production
        run: npm run build

      # next.config.ts has output: "standalone", which produces a self-contained
      # server in .next/standalone (~37 MB) instead of shipping all of node_modules.
      # Static assets and public/ must be copied in before zipping.
      - name: Assemble standalone bundle
        if: github.event_name != 'pull_request'
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public        .next/standalone/public

      - name: Create deployment package
        if: github.event_name != 'pull_request'
        run: |
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../..
          echo "deploy.zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Upload deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-package
          path: deploy.zip
          retention-days: 3

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-package

      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name:  ${{ env.AZURE_WEBAPP_NAME }}
          package:   deploy.zip

      # Keep runtime secrets in sync with what's in GitHub Secrets.
      # Remove or comment out this step if you manage App Settings manually.
      - name: Sync App Settings
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings \
                NODE_ENV=production \
                FRED_API_KEY="${{ secrets.FRED_API_KEY }}" \
                FRASER_API_KEY="${{ secrets.FRASER_API_KEY }}" \
                GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN_AI }}"

  # ── Validate ──────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request'
    permissions: {}

    steps:
      - name: Wait for app to warm up
        run: sleep 20

      - name: Check homepage returns HTTP 200
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 30 \
            "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net")
          echo "Homepage status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Check AI chat request validation
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"messages":[]}' \
            "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/ai/chat")
          echo "Chat API status: $STATUS"
          [ "$STATUS" = "400" ] || exit 1

      - name: Deployment summary
        run: |
          echo "✅ EconoMonitor deployed successfully"
          echo "🌐 URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
